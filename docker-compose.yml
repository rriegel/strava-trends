version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: strava-trends-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strava_trends
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strava_trends"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
